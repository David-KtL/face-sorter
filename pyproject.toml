[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-sorter"
version = "0.4.0"
description = "Agrupa fotos por persona en carpetas usando reconocimiento facial local"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "pillow-heif>=0.13",
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "tqdm>=4.66",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-qt>=4.4", "ruff>=0.4", "black>=24", "mypy>=1.9"]

[project.scripts]
face-sorter = "face_sorter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
